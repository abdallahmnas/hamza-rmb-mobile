name: hamza_rmb
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/app_logo.png
    - assets/images/onboarding_ship.jpg
    - assets/images/onboarding_exchange.jpg
    - assets/images/onboarding_buy.jpg
    - assets/svg/
    - assets/lottie/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/app_logo.png
  android: true
  ios: true
