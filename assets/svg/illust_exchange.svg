<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <filter id="exchange-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <!-- Coin 3D Gradients -->
    <linearGradient id="naira-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="naira-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="yuan-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="yuan-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="arrow-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="arrow-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="200" cy="315" rx="140" ry="38" fill="#0f172a" fill-opacity="0.08" />
  <ellipse cx="120" cy="285" rx="45" ry="14" fill="#0f172a" fill-opacity="0.12" />
  <ellipse cx="280" cy="225" rx="42" ry="13" fill="#0f172a" fill-opacity="0.1" />

  <!-- 3D Circular Exchange Arrows Base Ring -->
  <g filter="url(#exchange-shadow)">
    <!-- Blue Semi-Circle Arrow (Left & Front) -->
    <path d="M120 230 C120 280 200 305 240 280 L240 265 C190 288 140 262 140 230 Z" fill="#1e3a8a"/>
    <path d="M120 220 C120 270 200 295 240 270 L240 255 C190 278 140 252 140 220 Z" fill="url(#arrow-blue)"/>
    <!-- Blue Arrowhead -->
    <path d="M230 250 L255 272 L225 285 Z" fill="#1d4ed8"/>

    <!-- Orange Semi-Circle Arrow (Right & Top) -->
    <path d="M280 185 C280 140 200 120 160 145 L160 160 C200 138 260 155 260 185 Z" fill="#9a3412"/>
    <path d="M280 175 C280 130 200 110 160 135 L160 150 C200 128 260 145 260 175 Z" fill="url(#arrow-orange)"/>
    <!-- Orange Arrowhead -->
    <path d="M170 158 L145 136 L175 123 Z" fill="#ea580c"/>
  </g>

  <!-- Left Coin: Naira (₦) -->
  <g filter="url(#exchange-shadow)">
    <!-- 3D Cylinder Thickness -->
    <ellipse cx="120" cy="236" rx="42" ry="46" fill="url(#naira-rim)"/>
    <path d="M78 220 L78 236 C78 262 162 262 162 236 L162 220 Z" fill="url(#naira-rim)"/>
    <!-- Coin Face -->
    <ellipse cx="120" cy="220" rx="42" ry="46" fill="url(#naira-front)" stroke="#60a5fa" stroke-width="2"/>
    <!-- Naira Symbol ₦ -->
    <text x="120" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">₦</text>
  </g>

  <!-- Right Coin: Yuan (¥) -->
  <g filter="url(#exchange-shadow)">
    <!-- 3D Cylinder Thickness -->
    <ellipse cx="280" cy="166" rx="40" ry="44" fill="url(#yuan-rim)"/>
    <path d="M240 150 L240 166 C240 190 320 190 320 166 L320 150 Z" fill="url(#yuan-rim)"/>
    <!-- Coin Face -->
    <ellipse cx="280" cy="150" rx="40" ry="44" fill="url(#yuan-front)" stroke="#fdba74" stroke-width="2"/>
    <!-- Yuan Symbol ¥ -->
    <text x="280" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">¥</text>
  </g>

  <!-- 3D Isometric "EXCHANGE" Title Block Text -->
  <g opacity="0.85">
    <text x="200" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#94a3b8" letter-spacing="6">EXCHANGE</text>
  </g>
</svg>
